name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: |
        1. Opened a folder of 300 holiday photos
        2. Added a Date step (Taken, Year Month Day) and a Numbers step
        3. Pressed Rename, and two photos got the same name
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Alterix version
      description: Shown next to the name at the top of the Alterix window
      placeholder: e.g. v1.4.0
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 26.1, Ubuntu 24.04
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or a screen recording help a lot. The log file helps too (Settings > Data and integration > View Logs). You can drag them in here.
