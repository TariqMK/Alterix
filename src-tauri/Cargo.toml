[package]
name = "alterix"
version = "0.0.0-dev"
description = "Free, open-source, cross-platform bulk file renamer."
license = "GPL-3.0-only"
repository = "https://github.com/TariqMK/Alterix"
edition = "2021"
publish = false

[lib]
name = "alterix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
crc32fast = "1.5.5"
fancy-regex = "0.20.2"
imagesize = "0.15.0"
kamadak-exif = "0.6.2"
lofty = "0.25.5"
lopdf = "0.47.0"
matroska = "0.30.1"
md-5 = "0.11.0"
mp4 = "0.14.0"
os_info = "3.15.0"
rand = "0.10.4"
regex = "1"
rquickjs = { version = "0.14.0", features = ["array-buffer", "classes", "properties"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
sha3 = "0.12.0"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
trash = "5.4.0"
ulid = "3.0.0"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.3", features = ["v4"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
